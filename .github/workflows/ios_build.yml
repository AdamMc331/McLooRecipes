name: iOS Build

# This will cancel any in progress workflows for the same PR, if
# multiple pushes happen in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on: pull_request

jobs:
  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/workflow_setup
        with:
          google_services_json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          google_services_plist: ${{ secrets.GOOGLE_SERVICES_PLIST }}

      - name: Run tests
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Build
        uses: sersoft-gmbh/xcodebuild-action@v4
        with:
          project: iosApp/mclooRecipesIOS.xcodeproj
          scheme: mclooRecipesIOS
          destination: name=iPhone 17
          sdk: iphoneos
          configuration: Debug
          action: build
          use-xcpretty: false
          build-settings: CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO