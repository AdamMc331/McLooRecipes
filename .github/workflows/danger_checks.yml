name: Danger Checks

# This will cancel any in progress workflows for the same PR, if
# multiple pushes happen in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on: pull_request

jobs:
  danger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version-file: .github/.java-version

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Recreate google-services.json
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_SECRET" > ./androidApp/google-services.json

      - name: Danger Checks
        uses: danger/kotlin@1.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}